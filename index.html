<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斌哥严选</title>
<style>
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;min-height:100vh;color:#0e2b3d;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#7ec8e3 0%,#a6dcf2 30%,#d8f1fb 100%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;
  }
  .site-header{text-align:center;padding:46px 16px 20px;}
  .site-header h1{
    margin:0;font-size:clamp(30px,5.5vw,52px);font-weight:900;letter-spacing:.18em;
    color:#fff;text-shadow:0 2px 0 #57a8cf,0 8px 22px rgba(10,70,110,.35);
  }
  .site-header p{margin:12px 0 0;color:#0d4e73;letter-spacing:.32em;font-size:13px;opacity:.85;}

  .toolbar{
    position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:12px 24px;background:rgba(255,255,255,.6);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.8);box-shadow:0 4px 18px rgba(20,90,140,.08);
  }
  .toolbar .inner{max-width:1180px;width:100%;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search{
    flex:1 1 240px;min-width:180px;padding:10px 16px;border-radius:999px;border:1.5px solid #bfe3f5;
    background:#fff;font-size:15px;outline:none;transition:.2s;font-family:inherit;
  }
  .search:focus{border-color:#4fb0dd;box-shadow:0 0 0 4px rgba(79,176,221,.18);}
  .tools{display:flex;gap:8px;flex-wrap:wrap;}

  .btn{
    padding:9px 18px;border-radius:999px;border:1.5px solid #4fb0dd;background:#fff;color:#12668f;
    font-size:14px;font-weight:600;cursor:pointer;transition:.18s;font-family:inherit;white-space:nowrap;
  }
  .btn:hover{background:#eaf7fe;transform:translateY(-1px);}
  .btn.primary{background:linear-gradient(135deg,#4fb0dd,#2a86bb);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(42,134,187,.35);}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:rgba(255,255,255,.7);}
  .btn.danger{border-color:#e08a8a;color:#b34040;}
  .btn.danger:hover{background:#fdeeee;}
  .btn.tiny{padding:4px 12px;font-size:12.5px;}

  .container{max-width:1180px;margin:0 auto;padding:26px 24px 60px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px;}

  .card{
    position:relative;background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;
    box-shadow:0 6px 20px rgba(20,90,140,.14);transition:.22s;display:flex;flex-direction:column;
    animation:pop .3s ease both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .card:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(20,90,140,.24);}
  .cover{aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#e9f7fe,#c6e7f7);}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s;}
  .card:hover .cover img{transform:scale(1.05);}
  .cover.noimg{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#93cbe6;}
  .card-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;}
  .card-title{margin:0 0 6px;font-size:17px;line-height:1.4;font-weight:700;color:#0d3a55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{font-size:13px;color:#2f86b3;font-weight:600;margin-bottom:8px;}
  .card-excerpt{margin:0;font-size:13.5px;line-height:1.75;color:#5c7f92;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
    padding-top:10px;border-top:1px dashed #e3f0f7;font-size:12.5px;color:#8fb2c4;}

  .admin-tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3;}
  .icon-btn{
    width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#12668f;
    font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,60,100,.22);transition:.18s;line-height:1;
  }
  .icon-btn:hover{background:#fff;transform:scale(1.1);}
  .icon-btn.danger{color:#c0392b;}

  .empty{text-align:center;padding:70px 20px;color:#3d7c9e;font-size:16px;letter-spacing:.05em;}
  .empty .big{font-size:52px;display:block;margin-bottom:14px;opacity:.6;}

  footer{text-align:center;padding:0 0 40px;font-size:12.5px;color:#4d8aa8;opacity:.8;letter-spacing:.08em;}

  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(8,45,70,.55);backdrop-filter:blur(4px);}
  .modal.open{display:flex;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal-box{
    background:#fff;border-radius:20px;width:100%;max-width:760px;max-height:88vh;overflow:auto;
    padding:28px;position:relative;box-shadow:0 26px 70px rgba(0,40,70,.4);animation:up .25s ease;
  }
  @keyframes up{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-box.wide{max-width:820px;}
  .modal-box.small{max-width:400px;}
  .modal-close{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;
    border:none;background:#eef8fd;color:#2a7fb8;font-size:20px;cursor:pointer;line-height:1;transition:.18s;}
  .modal-close:hover{background:#d9eefa;transform:rotate(90deg);}
  .modal h2{margin:0 0 6px;color:#0d3a55;font-size:22px;}

  .d-title{margin:0 0 8px;font-size:26px;color:#0d3a55;line-height:1.35;padding-right:44px;}
  .d-meta{color:#2f86b3;font-size:14px;font-weight:600;margin-bottom:18px;
    padding-bottom:14px;border-bottom:2px solid #e6f4fb;}
  .d-cover{width:100%;border-radius:12px;margin-bottom:18px;display:block;}
  .d-content p{margin:0 0 15px;font-size:16.5px;line-height:2.05;text-indent:2em;color:#22415a;}
  .d-h4{margin:24px 0 12px;font-size:15px;color:#2a7fb8;letter-spacing:.06em;}
  .d-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .d-imgs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;cursor:zoom-in;
    box-shadow:0 3px 10px rgba(20,90,140,.16);transition:.2s;}
  .d-imgs img:hover{transform:scale(1.03);}
  .d-files{list-style:none;padding:0;margin:0;}
  .d-files li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;
    background:#f2fafe;margin-bottom:8px;font-size:14px;}
  .d-files .fname{flex:1;color:#155f88;font-weight:600;word-break:break-all;}
  .d-files .fsize{color:#89aec1;font-size:12.5px;}

  .field{margin-bottom:16px;}
  .field > label{display:block;font-size:13.5px;font-weight:700;color:#22637f;margin-bottom:7px;letter-spacing:.03em;}
  .field input[type=text],.field input[type=date],.field input[type=password],.field textarea{
    width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #cfe9f6;background:#fbfeff;
    font-size:15px;font-family:inherit;outline:none;transition:.18s;color:#12384f;
  }
  .field input:focus,.field textarea:focus{border-color:#4fb0dd;box-shadow:0 0 0 4px rgba(79,176,221,.15);background:#fff;}
  .field textarea{resize:vertical;line-height:1.85;min-height:150px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}
  input[type=file]{font-size:13.5px;color:#3b7c9c;width:100%;}
  .hint{font-size:12px;color:#8aa9ba;margin-top:6px;}

  .thumb-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .thumb{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;
    box-shadow:0 2px 8px rgba(20,90,140,.18);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;
    background:rgba(200,50,50,.9);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0;}
  .file-chip{display:flex;align-items:center;gap:8px;background:#f0f9fe;border-radius:9px;
    padding:7px 12px;font-size:13px;color:#155f88;margin:0 8px 8px 0;}
  .file-chip button{border:none;background:transparent;color:#c0392b;cursor:pointer;font-size:15px;line-height:1;}

  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;
    padding-top:18px;border-top:1px solid #eaf5fb;}

  #toast{position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);z-index:300;
    background:rgba(13,58,85,.94);color:#fff;padding:11px 24px;border-radius:999px;font-size:14px;
    opacity:0;pointer-events:none;transition:.28s;box-shadow:0 10px 26px rgba(0,30,60,.35);}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  #lightbox{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.88);padding:24px;cursor:zoom-out;}
  #lightbox.open{display:flex;}
  #lightbox img{max-width:100%;max-height:100%;border-radius:8px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#a9d8ee;border-radius:9px;}
  ::-webkit-scrollbar-thumb:hover{background:#7fc0de;}
</style>
</head>
<body>

<header class="site-header">
  <h1>斌哥严选</h1>
  <p>优 秀 作 文 展 示</p>
</header>

<div class="toolbar">
  <div class="inner">
    <input id="search" class="search" type="search" placeholder="🔍 搜索标题 / 作者 / 班级…">
    <div class="tools">
      <button id="addBtn" class="btn primary" hidden>＋ 新增作文</button>
      <button id="exportStudentBtn" class="btn ghost" hidden>🎓 导出学生版</button>
      <button id="exportBtn" class="btn ghost" hidden>导出备份</button>
      <button id="importBtn" class="btn ghost" hidden>导入备份</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button id="loginBtn" class="btn">管理员登录</button>
    </div>
  </div>
</div>

<main class="container">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <span class="big">📖</span>
    还没有收录作文，敬请期待～
  </div>
</main>

<footer>© 斌哥严选 · 记录每一篇好文章</footer>

<!-- 详情弹窗 -->
<div class="modal" id="detailModal">
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal" id="editModal">
  <div class="modal-box wide">
    <button class="modal-close" data-close>×</button>
    <h2 id="editHeading">新增作文</h2>
    <p class="hint" style="margin:0 0 20px;">带 * 为必填项</p>
    <form id="editForm">
      <div class="row2">
        <div class="field"><label>标题 *</label><input type="text" id="f-title" placeholder="如：秋天的雨" required></div>
        <div class="field"><label>作者 *</label><input type="text" id="f-author" placeholder="如：李小明" required></div>
      </div>
      <div class="row2">
        <div class="field"><label>班级</label><input type="text" id="f-class" placeholder="如：高二(3)班"></div>
        <div class="field"><label>日期</label><input type="date" id="f-date"></div>
      </div>
      <div class="field">
        <label>正文</label>
        <textarea id="f-content" placeholder="在这里粘贴或输入作文正文，回车换段…"></textarea>
      </div>
      <div class="field">
        <label>封面图片</label>
        <input type="file" id="f-cover" accept="image/*">
        <div id="coverPreview" class="thumb-list"></div>
      </div>
      <div class="field">
        <label>附加照片（可多选）</label>
        <input type="file" id="f-images" accept="image/*" multiple>
        <div id="imagesPreview" class="thumb-list"></div>
      </div>
      <div class="field">
        <label>文档附件（可多选，支持 doc / docx / pdf / txt 等）</label>
        <input type="file" id="f-files" multiple>
        <div id="filesPreview" style="margin-top:10px;"></div>
        <p class="hint">单个文件建议不超过 8MB，体积过大可能保存缓慢。</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="modal" id="loginModal">
  <div class="modal-box small">
    <button class="modal-close" data-close>×</button>
    <h2>管理员登录</h2>
    <p class="hint" style="margin:6px 0 18px;">请输入管理员密码</p>
    <div class="field">
      <input type="password" id="pwd" placeholder="管理员密码" autocomplete="off">
    </div>
    <div class="form-actions" style="margin-top:6px;">
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="button" class="btn primary" id="loginOk">登录</button>
    </div>
  </div>
</div>

<!-- 灯箱 & 提示 -->
<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div id="toast"></div>

<script>
/* =========================================================
   斌哥严选 —— 优秀作文展示
   修改管理员密码：改下面这一行即可
   ========================================================= */
const ADMIN_PASSWORD = 'bin2024';
const SESSION_KEY = 'binge_admin_logged';

/* ---------- 工具函数 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtSize(n){
  if(!n) return '';
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function fileToDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function compressImage(file, maxW = 1400, quality = 0.82){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function showModal(sel){
  $(sel).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function hideModal(sel){
  $(sel).classList.remove('open');
  if(!document.querySelector('.modal.open')) document.body.style.overflow = '';
}

/* ---------- 数据存储（IndexedDB，失败则退回 localStorage） ---------- */
let store = null;

function openDB(){
  return new Promise((resolve, reject) => {
    if(!window.indexedDB) return reject(new Error('no indexedDB'));
    let req;
    try { req = indexedDB.open('binge_essays_db', 1); }
    catch(e){ return reject(e); }
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('essays')) d.createObjectStore('essays', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('idb error'));
  });
}

async function initStore(){
  try{
    const db = await openDB();
    store = {
      getAll: () => new Promise((res, rej) => {
        const r = db.transaction('essays','readonly').objectStore('essays').getAll();
        r.onsuccess = () => res(r.result || []);
        r.onerror = () => rej(r.error);
      }),
      put: item => new Promise((res, rej) => {
        const r = db.transaction('essays','readwrite').objectStore('essays').put(item);
        r.onsuccess = () => res();
        r.onerror = () => rej(r.error);
      }),
      remove: id => new Promise((res, rej) => {
        const r = db.transaction('essays','readwrite').objectStore('essays').delete(id);
        r.onsuccess = () => res();
        r.onerror = () => rej(r.error);
      })
    };
  }catch(e){
    console.warn('IndexedDB 不可用，改用 localStorage：', e);
    const KEY = 'binge_essays_ls';
    store = {
      async getAll(){ try{ return JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(_){ return []; } },
      async put(item){
        const all = await this.getAll();
        const i = all.findIndex(x => x.id === item.id);
        if(i >= 0) all[i] = item; else all.push(item);
        localStorage.setItem(KEY, JSON.stringify(all));
      },
      async remove(id){
        const all = (await this.getAll()).filter(x => x.id !== id);
        localStorage.setItem(KEY, JSON.stringify(all));
      }
    };
  }
}

/* ---------- 全局状态 ---------- */
let items = [];
let isAdmin = false;
let editId = null;
let editCover = null;
let editImages = [];
let editFiles = [];

/* ---------- 渲染 ---------- */
function render(){
  const q = ($('#search').value || '').trim().toLowerCase();
  const list = items
    .filter(it => !q || `${it.title} ${it.author} ${it.className || ''}`.toLowerCase().includes(q))
    .sort((a, b) =>
      String(b.date || '').localeCompare(String(a.date || '')) ||
      (b.createdAt || 0) - (a.createdAt || 0)
    );

  const grid = $('#grid');
  if(!list.length){
    grid.innerHTML = '';
    $('#empty').hidden = false;
    return;
  }
  $('#empty').hidden = true;
  grid.innerHTML = list.map(cardHTML).join('');
}

function cardHTML(it){
  const cover = it.cover
    ? `<div class="cover"><img src="${it.cover}" alt="" loading="lazy"></div>`
    : `<div class="cover noimg">作</div>`;

  const raw = String(it.content || '').replace(/\s+/g, ' ').trim();
  const excerpt = raw.slice(0, 72);

  const badges = [];
  if(it.images && it.images.length) badges.push('🖼 ' + it.images.length);
  if(it.files && it.files.length) badges.push('📎 ' + it.files.length);

  const tools = isAdmin ? `
    <div class="admin-tools">
      <button class="icon-btn" data-act="edit" title="编辑">✎</button>
      <button class="icon-btn danger" data-act="del" title="删除">🗑</button>
    </div>` : '';

  return `
  <article class="card" data-id="${it.id}">
    ${cover}
    ${tools}
    <div class="card-body">
      <h3 class="card-title">${esc(it.title)}</h3>
      <div class="card-meta">${esc(it.author)}${it.className ? ' · ' + esc(it.className) : ''}</div>
      <p class="card-excerpt">${esc(excerpt)}${raw.length > 72 ? '…' : ''}</p>
      <div class="card-foot">
        <span>${esc(it.date || '')}</span>
        <span>${badges.join('&nbsp; ')}</span>
      </div>
    </div>
  </article>`;
}

/* ---------- 详情 ---------- */
function openDetail(id){
  const it = items.find(x => x.id === id);
  if(!it) return;

  const paras = String(it.content || '')
    .split(/\r?\n+/).map(s => s.trim()).filter(Boolean)
    .map(s => `<p>${esc(s)}</p>`).join('');

  const imgsHTML = (it.images || []).map((im, i) =>
    `<img class="detail-img" src="${im.data}" data-src="${im.data}" alt="照片${i + 1}">`
  ).join('');

  const filesHTML = (it.files || []).map((f, i) => `
    <li>
      <span class="fname">📎 ${esc(f.name)}</span>
      <span class="fsize">${fmtSize(f.size)}</span>
      <button type="button" class="btn tiny" data-dl="${i}">下载</button>
    </li>`).join('');

  const body = $('#detailBody');
  body.innerHTML = `
    <h2 class="d-title">${esc(it.title)}</h2>
    <div class="d-meta">${esc(it.author)}${it.className ? ' · ' + esc(it.className) : ''}${it.date ? ' · ' + esc(it.date) : ''}</div>
    ${it.cover ? `<img class="d-cover" src="${it.cover}" alt="封面">` : ''}
    ${paras ? `<div class="d-content">${paras}</div>` : ''}
    ${imgsHTML ? `<h4 class="d-h4">📷 照片</h4><div class="d-imgs">${imgsHTML}</div>` : ''}
    ${filesHTML ? `<h4 class="d-h4">📎 文档附件</h4><ul class="d-files">${filesHTML}</ul>` : ''}
  `;

  body.querySelectorAll('[data-dl]').forEach(b => {
    b.onclick = () => downloadAttachment(it.files[+b.dataset.dl]);
  });
  body.querySelectorAll('.detail-img').forEach(img => {
    img.onclick = () => openLightbox(img.dataset.src);
  });

  showModal('#detailModal');
}

function downloadAttachment(f){
  if(!f) return;
  const a = document.createElement('a');
  a.href = f.data;
  a.download = f.name || 'attachment';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ---------- 灯箱（修正：点击图片不关闭） ---------- */
function openLightbox(src){
  $('#lightboxImg').src = src;
  $('#lightbox').classList.add('open');
}
function closeLightbox(){
  $('#lightbox').classList.remove('open');
  $('#lightboxImg').src = '';
}

/* ---------- 编辑器 ---------- */
function openEditor(id){
  editId = id || null;
  const it = id ? items.find(x => x.id === id) : null;

  $('#editHeading').textContent = it ? '编辑作文' : '新增作文';
  $('#f-title').value    = it ? it.title : '';
  $('#f-author').value   = it ? it.author : '';
  $('#f-class').value    = it ? (it.className || '') : '';
  // 修正：编辑时保留原有空日期，不强制填今天
  $('#f-date').value     = it ? (it.date || '') : todayStr();
  $('#f-content').value  = it ? (it.content || '') : '';

  editCover  = it ? (it.cover || null) : null;
  editImages = it && it.images ? it.images.slice() : [];
  editFiles  = it && it.files  ? it.files.slice()  : [];

  $('#f-cover').value = '';
  $('#f-images').value = '';
  $('#f-files').value = '';

  renderCoverPreview();
  renderImagesPreview();
  renderFilesPreview();
  showModal('#editModal');
}

function renderCoverPreview(){
  const el = $('#coverPreview');
  el.innerHTML = editCover
    ? `<div class="thumb"><img src="${editCover}" alt=""><button type="button" class="thumb-del" data-del-cover>×</button></div>`
    : '';
  const b = el.querySelector('[data-del-cover]');
  if(b) b.onclick = () => { editCover = null; renderCoverPreview(); };
}

function renderImagesPreview(){
  const el = $('#imagesPreview');
  el.innerHTML = editImages.map((im, i) => `
    <div class="thumb">
      <img src="${im.data}" alt="">
      <button type="button" class="thumb-del" data-del-img="${i}">×</button>
    </div>`).join('');
  el.querySelectorAll('[data-del-img]').forEach(b => {
    b.onclick = () => {
      editImages.splice(+b.dataset.delImg, 1);
      renderImagesPreview();
    };
  });
}

function renderFilesPreview(){
  const el = $('#filesPreview');
  el.innerHTML = editFiles.map((f, i) => `
    <span class="file-chip">
      📎 ${esc(f.name)} <small style="color:#8aa9ba">(${fmtSize(f.size)})</small>
      <button type="button" data-del-file="${i}">×</button>
    </span>`).join('');
  el.querySelectorAll('[data-del-file]').forEach(b => {
    b.onclick = () => {
      editFiles.splice(+b.dataset.delFile, 1);
      renderFilesPreview();
    };
  });
}

/* ---------- 保存 ---------- */
$('#editForm').addEventListener('submit', async e => {
  e.preventDefault();

  const title  = $('#f-title').value.trim();
  const author = $('#f-author').value.trim();
  if(!title || !author){ toast('标题和作者不能为空'); return; }

  const old = editId ? items.find(x => x.id === editId) : null;

  const item = {
    id: editId || ('e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)),
    title,
    author,
    className: $('#f-class').value.trim(),
    date: $('#f-date').value || '',
    content: $('#f-content').value,
    cover: editCover || null,
    images: editImages,
    files: editFiles,
    createdAt: old ? (old.createdAt || Date.now()) : Date.now(),
    updatedAt: Date.now()
  };

  try{
    await store.put(item);
    items = await store.getAll();
    hideModal('#editModal');
    render();
    toast(old ? '已更新 ✓' : '已添加 ✓');
  }catch(err){
    console.error(err);
    toast('保存失败：' + (err.message || '存储空间不足，请减少附件大小'));
  }
});

/* 选择封面 */
$('#f-cover').addEventListener('change', async e => {
  const f = e.target.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast('请选择图片文件'); return; }
  editCover = await compressImage(f, 1400, 0.82);
  e.target.value = '';
  renderCoverPreview();
});

/* 选择附加照片 */
$('#f-images').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  let n = 0;
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    const data = await compressImage(f, 1400, 0.8);
    editImages.push({ name: f.name, data });
    n++;
  }
  e.target.value = '';
  renderImagesPreview();
  if(n) toast(`已添加 ${n} 张照片`);
});

/* 选择文档 */
$('#f-files').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  let n = 0;
  for(const f of files){
    if(f.size > 8 * 1024 * 1024){
      toast(`「${f.name}」超过 8MB，已跳过`);
      continue;
    }
    const data = await fileToDataURL(f);
    editFiles.push({ name: f.name, type: f.type, size: f.size, data });
    n++;
  }
  e.target.value = '';
  renderFilesPreview();
  if(n) toast(`已添加 ${n} 个附件`);
});

/* ---------- 网格事件 ---------- */
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(!card) return;
  const id = card.dataset.id;
  const act = e.target.closest('[data-act]');

  if(act){
    e.stopPropagation();
    if(act.dataset.act === 'edit') openEditor(id);
    else if(act.dataset.act === 'del') confirmDelete(id);
    return;
  }
  openDetail(id);
});

async function confirmDelete(id){
  const it = items.find(x => x.id === id);
  if(!it) return;
  if(!confirm(`确定删除《${it.title}》吗？此操作不可恢复。`)) return;
  await store.remove(id);
  items = await store.getAll();
  render();
  toast('已删除');
}

/* ---------- 搜索 ---------- */
$('#search').addEventListener('input', render);

/* ---------- 管理员登录 ---------- */
$('#loginBtn').addEventListener('click', () => {
  if(isAdmin){
    isAdmin = false;
    sessionStorage.removeItem(SESSION_KEY);

$('#loginOk').addEventListener('click', doLogin);
$('#pwd').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

function doLogin(){

    $('#pwd').value = '';

}

function updateAdminUI(){

/* ---------- 新增按钮 ---------- */
$('#addBtn').addEventListener('click', () => openEditor(null));

/* =========================================================
   ★ 导出学生版：生成一个独立、只读、双击就能看的 HTML
   ========================================================= */
function buildStudentHTML(data){
  const json = JSON.stringify(data)
    .replace(/</g, '\\u003c')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');

  const css = document.querySelector('style').textContent;

  const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斌哥严选</title>
<style>${css}</style>
</head>
<body>

<header class="site-header">
  <h1>斌哥严选</h1>
  <p>优 秀 作 文 展 示</p>
</header>

<div class="toolbar">
  <div class="inner">
    <input id="search" class="search" type="search" placeholder="🔍 搜索标题 / 作者 / 班级…">
  </div>
</div>

<main class="container">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <span class="big">📖</span>
    还没有收录作文，敬请期待～
  </div>
</main>

<footer>© 斌哥严选 · 记录每一篇好文章</footer>

<div class="modal" id="detailModal">
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <div id="detailBody"></div>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" alt=""></div>

<script>
var DATA = __DATA__;

(function(){
  'use strict';

  function $(s){ return document.querySelector(s); }

  function esc(s){
    return String(s == null ? '' : s)
      .split('&').join('&amp;')
      .split('<').join('&lt;')
      .split('>').join('&gt;')
      .split('"').join('&quot;')
      .split("'").join('&#39;');
  }

  function fmtSize(n){
    if(!n) return '';
    if(n < 1024) return n + ' B';
    if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
    return (n/1048576).toFixed(1) + ' MB';
  }

  function cardHTML(it){
    var cover = it.cover
      ? '<div class="cover"><img src="' + it.cover + '" alt="" loading="lazy"></div>'
      : '<div class="cover noimg">作</div>';

    var raw = String(it.content || '').replace(/\\s+/g, ' ').trim();
    var excerpt = raw.slice(0, 72);

    var badges = [];
    if(it.images && it.images.length) badges.push('🖼 ' + it.images.length);
    if(it.files && it.files.length) badges.push('📎 ' + it.files.length);

    return '<article class="card" data-id="' + it.id + '">'
      + cover
      + '<div class="card-body">'
      +   '<h3 class="card-title">' + esc(it.title) + '</h3>'
      +   '<div class="card-meta">' + esc(it.author) + (it.className ? ' · ' + esc(it.className) : '') + '</div>'
      +   '<p class="card-excerpt">' + esc(excerpt) + (raw.length > 72 ? '…' : '') + '</p>'
      +   '<div class="card-foot"><span>' + esc(it.date || '') + '</span><span>' + badges.join('&nbsp; ') + '</span></div>'
      + '</div>'
      + '</article>';
  }

  function render(){
    var q = ($('#search').value || '').trim().toLowerCase();
    var list = DATA.filter(function(it){
      return !q || (it.title + ' ' + it.author + ' ' + (it.className || '')).toLowerCase().indexOf(q) >= 0;
    }).sort(function(a, b){
      return String(b.date || '').localeCompare(String(a.date || ''))
          || ((b.createdAt || 0) - (a.createdAt || 0));
    });

    var grid = $('#grid');
    if(!list.length){
      grid.innerHTML = '';
      $('#empty').hidden = false;
      return;
    }
    $('#empty').hidden = true;
    grid.innerHTML = list.map(cardHTML).join('');
  }

  function downloadAttachment(f){
    if(!f) return;
    var a = document.createElement('a');
    a.href = f.data;
    a.download = f.name || 'attachment';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function openLightbox(src){
    $('#lightboxImg').src = src;
    $('#lightbox').classList.add('open');
  }
  function closeLightbox(){
    $('#lightbox').classList.remove('open');
    $('#lightboxImg').src = '';
  }
  function showModal(sel){
    $(sel).classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function hideModal(sel){
    $(sel).classList.remove('open');
    document.body.style.overflow = '';
  }

  function openDetail(id){
    var it = null;
    for(var i = 0; i < DATA.length; i++){
      if(DATA[i].id === id){ it = DATA[i]; break; }
    }
    if(!it) return;

    var paras = String(it.content || '')
      .split(/\\r?\\n+/)
      .map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length > 0; })
      .map(function(s){ return '<p>' + esc(s) + '</p>'; })
      .join('');

    var imgsHTML = (it.images || []).map(function(im, i){
      return '<img class="detail-img" src="' + im.data + '" data-src="' + im.data + '" alt="照片' + (i + 1) + '">';
    }).join('');

    var filesHTML = (it.files || []).map(function(f, i){
      return '<li><span class="fname">📎 ' + esc(f.name) + '</span>'
        + '<span class="fsize">' + fmtSize(f.size) + '</span>'
        + '<button type="button" class="btn tiny" data-dl="' + i + '">下载</button></li>';
    }).join('');

    var body = $('#detailBody');
    body.innerHTML =
        '<h2 class="d-title">' + esc(it.title) + '</h2>'
      + '<div class="d-meta">' + esc(it.author)
      +   (it.className ? ' · ' + esc(it.className) : '')
      +   (it.date ? ' · ' + esc(it.date) : '') + '</div>'
      + (it.cover ? '<img class="d-cover" src="' + it.cover + '" alt="封面">' : '')
      + (paras ? '<div class="d-content">' + paras + '</div>' : '')
      + (imgsHTML ? '<h4 class="d-h4">📷 照片</h4><div class="d-imgs">' + imgsHTML + '</div>' : '')
      + (filesHTML ? '<h4 class="d-h4">📎 文档附件</h4><ul class="d-files">' + filesHTML + '</ul>' : '');

    body.querySelectorAll('[data-dl]').forEach(function(b){
      b.onclick = function(){ downloadAttachment(it.files[+b.dataset.dl]); };
    });
    body.querySelectorAll('.detail-img').forEach(function(img){
      img.onclick = function(){ openLightbox(img.dataset.src); };
    });

    showModal('#detailModal');
  }

  $('#search').addEventListener('input', render);

  $('#grid').addEventListener('click', function(e){
    var card = e.target.closest('.card');
    if(card) openDetail(card.dataset.id);
  });

  document.addEventListener('click', function(e){
    var c = e.target.closest('[data-close]');
    if(c){ hideModal('#detailModal'); return; }
    if(e.target.classList && e.target.classList.contains('modal')){
      hideModal('#' + e.target.id);
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ hideModal('#detailModal'); closeLightbox(); }
  });

  // 修正：只有点击背景才关闭灯箱
  $('#lightbox').addEventListener('click', function(e){
    if(e.target === e.currentTarget) closeLightbox();
  });

  render();
})();
<\/script>
</body>
</html>`;

  return html.replace('__DATA__', function(){ return json; });
}

$('#exportStudentBtn').addEventListener('click', () => {
  if(!items.length){ toast('还没有作文，先添加几篇吧'); return; }
  toast('正在生成，请稍候…');
  setTimeout(() => {
    try{
      const html = buildStudentHTML(items);
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `斌哥严选-学生版-${todayStr()}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('学生版已生成，发到班级群即可 🎓');
    }catch(err){
      console.error(err);
      toast('生成失败：' + (err.message || '未知错误'));
    }
  }, 60);
});

/* ---------- 备份导出 / 导入 ---------- */
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `斌哥严选-备份-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('备份已导出');
});

$('#importBtn').addEventListener('click', () => $('#importFile').click());

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if(!f) return;
  try{
    const arr = JSON.parse(await f.text());
    if(!Array.isArray(arr)) throw new Error('文件格式不正确');
    let n = 0;
    for(const it of arr){
      if(!it || !it.id) continue;
      await store.put(it);
      n++;
    }
    items = await store.getAll();
    render();
    toast(`成功导入 ${n} 篇作文`);
  }catch(err){
    console.error(err);
    toast('导入失败：' + (err.message || '未知错误'));
  }
  e.target.value = '';
});

/* ---------- 弹窗通用关闭 ---------- */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if(c){
    const m = c.closest('.modal');
    if(m) hideModal('#' + m.id);
    return;
  }
  if(e.target.classList && e.target.classList.contains('modal')){
    hideModal('#' + e.target.id);
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    $$('.modal.open').forEach(m => hideModal('#' + m.id));
    closeLightbox();
  }
});
// 修正：只有点击背景才关闭灯箱
$('#lightbox').addEventListener('click', e => {
  if(e.target === e.currentTarget) closeLightbox();
});

/* ---------- 启动 ---------- */
(async function init(){
  await initStore();
  try{
    items = await store.getAll();
  }catch(e){
    console.error(e);
    items = [];
  }

  // 首次打开自动写入范文
  if(items.length === 0){
    const seed = {

               '春天，槐花开了，一串串，一簇簇，白得像雪，香得醉人。奶奶会搬出长长的竹竿，轻轻敲打树枝，花瓣便纷纷扬扬地落下来，像一场温柔的雨。我端着竹篮在树下接，花瓣落在头发上、肩膀上，奶奶就笑，说我是“花丫头”。\n' +
               '夏天，槐树撑开巨大的绿伞，把烈日筛成碎金。我们一家人在树下吃饭、乘凉，听爷爷讲他年轻时的故事。爷爷摇着蒲扇，风里带着槐叶的清香，蝉鸣一声长一声短，像给故事配的背景音乐。\n' +
               '秋天，槐叶黄了，一片片飘下来，铺成金色的地毯。我踩上去，沙沙的响，像在跟秋天说悄悄话。\n' +
               '冬天，槐树光着枝丫，在寒风里站着，像一位沉默的老人。可我知道，它只是在睡觉，等到来年春天，又会醒过来，重新长出一树繁花。\n' +
               '如今，我离家求学，每次回去，总要先去看看那棵老槐树。它还在，依旧沉默，依旧繁茂。而我，在它的年轮里，悄悄长大了。',
      cover: null,

  isAdmin = sessionStorage.getItem(SESSION_KEY) === '1';
  updateAdminUI();
  render();
})();
</script>
